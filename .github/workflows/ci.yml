name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Nothing here deploys or reads repository secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-lock.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt ruff==0.11.13 pytest-timeout==2.4.0

    - name: Lint with ruff
      run: ruff check app/ tests/ --output-format=github

    - name: Run unit tests
      env:
        OPENAI_API_KEY: fake_test_key
        GCP_PROJECT_ID: test-project
        AUTH_DEV_BYPASS: true
        DEV_API_KEY: test-dev-key
      run: pytest tests --ignore=tests/e2e --timeout=120

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        load: true
        push: false
        tags: stylize-mcp-server:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm -d --name test-container \
          -e OPENAI_API_KEY=fake_test_key \
          -e GCP_PROJECT_ID=test-project \
          -e AUTH_DEV_BYPASS=true \
          -e DEV_API_KEY=test-dev-key \
          -p 8080:8080 stylize-mcp-server:latest
        
        # Wait for container to start
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:8080/health || exit 1
        
        # Clean up
        docker stop test-container

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
